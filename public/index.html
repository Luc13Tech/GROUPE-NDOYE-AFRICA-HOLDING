  <title>Groupe Ndoye Africa Holding — Bâtir l'Afrique de demain</title>

  <style>
    /* Styles critiques — évitent le flash au chargement */
    html, body { margin: 0; padding: 0; background: #F4EEE4; }
    body { font-family: "Times New Roman", Tinos, "Liberation Serif", Times, serif; }
    #root { min-height: 100vh; }
    .gnah-splash {
      position: fixed; inset: 0; background: #17392F;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity .6s ease;
    }
    .gnah-splash.hide { opacity: 0; pointer-events: none; }
    .gnah-splash-mark { width: 44px; height: 44px; border: 1.5px solid #F4EEE4; margin-bottom: 22px; animation: splashPulse 1.5s ease-in-out infinite alternate; }
    .gnah-splash-logo {
      color: #F4EEE4; font-size: clamp(1.1rem,4vw,1.6rem); letter-spacing: .32em; text-transform: uppercase;
      font-weight: 700; text-align: center; line-height: 1.5;
    }
    .gnah-splash-sub { font-style: italic; color: rgba(244,238,228,.6); font-size: clamp(.8rem,2.4vw,.95rem); letter-spacing: .12em; margin-top: 8px; }
    .gnah-splash-bar { width: 160px; height: 2px; background: rgba(244,238,228,.18); margin-top: 26px; overflow: hidden; }
    .gnah-splash-bar-fill { height: 100%; background: #BF5A33; animation: splashLoad .9s ease-out forwards; }
    @keyframes splashPulse { from { opacity: .55 } to { opacity: 1 } }
    @keyframes splashLoad { from { width: 0 } to { width: 100% } }
  </style>
</head>
<body>
  <!-- Splash screen -->
  <div class="gnah-splash" id="splash">
    <div class="gnah-splash-mark"></div>
    <div class="gnah-splash-logo">Groupe Ndoye<br/>Africa Holding</div>
    <div class="gnah-splash-sub">Bâtir l’Afrique de demain</div>
    <div class="gnah-splash-bar"><div class="gnah-splash-bar-fill"></div></div>
  </div>

  <noscript>
    <div style="font-family:'Times New Roman',Times,serif;text-align:center;padding:60px 20px;background:#17392F;color:#F4EEE4;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column">
      <div style="font-size:1.3rem;letter-spacing:.24em;margin-bottom:10px;text-transform:uppercase">Groupe Ndoye Africa Holding</div>
      <div style="font-size:1rem;color:rgba(244,238,228,.7)">Veuillez activer JavaScript pour accéder à la plateforme.</div>
    </div>
  </noscript>

  <div id="root"></div>

  <!-- Register Service Worker -->
  <script>
    // Hide splash screen when React loads
    window.addEventListener('load', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hide');
          setTimeout(function() { splash.remove(); }, 700);
        }
      }, 900);
    });

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            // Check for updates every 60 seconds
            setInterval(function() { reg.update(); }, 60000);
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available - reload to update
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });
          })
          .catch(function() {});
      });
    }
  </script>
</body>
</html>
